<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판매제품 | 하나투빔프로젝터</title>
<meta name="description" content="신품, 미개봉, 중고빔프로젝터 판매 목록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #170f21;
    --surface: #241735;
    --surface-2: #2e1d45;
    --line: #3c2a57;
    --gold: #ffd873;
    --gold-dim: #c9a655;
    --text: #f1eafe;
    --text-dim: #b8a9cc;
    --purple-accent: #8b5fd9;
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.6;
    overflow:hidden; /* 페이지 자체는 스크롤 안 됨, 상품 영역만 스크롤 */
  }
  h1,h2,h3,.brand{font-family:'Black Han Sans', sans-serif; letter-spacing:.5px;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  .app-shell{display:flex; flex-direction:column; height:100vh;}

  /* HEADER */
  header{
    flex:0 0 auto;
    background:rgba(23,15,33,.95);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{display:flex; align-items:center; justify-content:space-between; height:68px;}
  .brand{font-size:22px; color:var(--gold);}
  .brand span{color:var(--text);}
  .navlinks{display:flex; align-items:center; gap:16px; font-weight:500; font-size:15px;}
  .navlinks a{color:var(--text-dim); transition:color .2s;}
  .navlinks a:hover{color:var(--gold);}
  .navlinks a.home-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 16px; border-radius:999px; font-weight:700; font-size:14px;
  }
  .navlinks a.home-btn:hover{border-color:var(--gold); color:var(--gold);}
  .navlinks a.store-btn{
    background:transparent; border:1px solid #03c75a; color:#03c75a;
    padding:9px 16px; border-radius:999px; font-weight:700; font-size:14px;
  }
  .navlinks a.store-btn:hover{background:#03c75a; color:#0d1a10;}
  .navlinks a.cta{
    background:var(--gold); color:#1a1024; padding:9px 18px; border-radius:999px; font-weight:700;
  }
  .navlinks a.cta:hover{opacity:.9;}

  /* PAGE HEAD (고정, 스크롤 안 됨) */
  .page-head{
    flex:0 0 auto;
    padding:28px 0 20px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(ellipse 60% 100% at 50% 0%, rgba(139,95,217,.28), transparent 70%),
      radial-gradient(ellipse 40% 80% at 20% 100%, rgba(255,216,115,.08), transparent 70%),
      radial-gradient(ellipse 40% 80% at 80% 100%, rgba(255,216,115,.08), transparent 70%);
    text-align:center;
  }
  .page-head .eyebrow{color:var(--gold-dim); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase;}
  .page-head h1{font-size:26px; margin:6px 0 16px; line-height:1.5; word-break:keep-all; letter-spacing:normal;}
  .filter-tabs{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .filter-tabs button{
    background:var(--surface); border:1px solid var(--line); color:var(--text-dim);
    padding:9px 18px; border-radius:999px; font-size:14px; font-weight:500; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
    transition:all .15s;
  }
  .filter-tabs button.active, .filter-tabs button:hover{
    background:var(--gold); color:#1a1024; border-color:var(--gold);
  }

  /* SCROLL AREA - 상품 목록만 여기서 스크롤 */
  .scroll-area{
    flex:1 1 auto;
    overflow-y:auto;
    padding:28px 0 60px;
  }

  .product-grid{display:grid; grid-template-columns:1fr; gap:22px; max-width:640px; margin:0 auto;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; transition:border-color .2s, transform .2s;
  }
  .card:hover{border-color:var(--purple-accent); transform:translateY(-4px);}
  .card-img{
    aspect-ratio:4/3; background:linear-gradient(145deg, var(--surface-2), var(--surface));
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:13px;
    border-bottom:1px solid var(--line);
  }
  .card-body{padding:18px;}
  .card-tag{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;
    background:rgba(255,216,115,.12); color:var(--gold); margin-bottom:10px;
  }
  .card-body h3{font-size:17px; font-family:'Noto Sans KR', sans-serif; font-weight:700; margin-bottom:6px;}
  .card-body .price{color:var(--gold); font-weight:900; font-size:19px; margin:8px 0 12px;}
  .card-body .spec{color:var(--text-dim); font-size:13px; margin-bottom:2px;}
  .card-body .buy{
    display:block; text-align:center; margin-top:14px; padding:10px; border-radius:8px;
    border:1px solid var(--line); color:var(--text); font-size:14px; font-weight:700;
  }
  .card-body .buy:hover{border-color:var(--gold); color:var(--gold);}

  /* 하단 고정 메인으로 버튼 (모바일 등 편의용) */
  .float-home{
    position:fixed; bottom:22px; right:22px; z-index:60;
    background:var(--gold); color:#1a1024; font-weight:700; font-size:13px;
    padding:12px 18px; border-radius:999px; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .float-home:hover{opacity:.9;}

  @media (max-width: 860px){
    .product-grid{grid-template-columns:repeat(2, 1fr);}
    .navlinks a:not(.home-btn):not(.cta):not(.store-btn){display:none;}
  }
  @media (max-width: 520px){
    .product-grid{grid-template-columns:1fr;}
    .page-head h1{font-size:20px;}
    .page-head{padding:20px 0 16px;}
  }
</style>
</head>
<body>

<div class="app-shell">
  <header>
    <nav class="wrap">
      <a href="index.html" class="brand">하나투<span>빔프로젝터</span></a>
      <div class="navlinks">
        <a href="index.html#about">업체소개</a>
        <a href="index.html#location">오시는길</a>
        <a href="https://smartstore.naver.com/hana2" target="_blank" rel="noopener" class="store-btn">🛒 스마트스토어</a>
        <a href="index.html" class="home-btn">🏠 메인으로</a>
        <a href="index.html#contact" class="cta">문의하기</a>
      </div>
    </nav>
  </header>

  <div class="page-head wrap">
    <div class="eyebrow">판매제품</div>
    <h1>신품 · 미개봉 · 중고 빔프로젝터</h1>
    <div class="filter-tabs">
      <button class="active" data-filter="all">전체</button>
      <button data-filter="신품">신품</button>
      <button data-filter="미개봉">미개봉</button>
      <button data-filter="중고">중고</button>
    </div>
  </div>

  <main class="scroll-area">
    <div class="wrap">
      <div class="product-grid" id="productGrid">
        <p style="color:var(--text-dim); grid-column:1/-1;">상품 목록을 불러오는 중...</p>
      </div>
    </div>
  </main>
</div>

<a href="index.html" class="float-home">🏠 메인으로</a>

<script>
  // ===== 구글시트 CSV 링크 (index.html과 동일하게 유지하세요) =====
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrhvYUwjiy4k1IudLk6KL7FRrEFSyB5tQNHIcQjIKbvMpgk5qhujPgmWOkr9JGemOoyl2Dqy5PV4wd/pub?output=csv";

  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if (inQuotes){
        if (c === '"' && next === '"'){ field += '"'; i++; }
        else if (c === '"'){ inQuotes = false; }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n' || c === '\r'){
          if (field !== '' || row.length){ row.push(field); rows.push(row); row = []; field = ''; }
        } else field += c;
      }
    }
    if (field !== '' || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.length && r.some(v => v.trim() !== ''));
  }

  function renderProducts(rows){
    const grid = document.getElementById('productGrid');
    const items = rows.slice(1).filter(r => r[1] && r[1].trim());
    if (!items.length){
      grid.innerHTML = '<p style="color:var(--text-dim); grid-column:1/-1;">등록된 상품이 없습니다. 구글시트에 상품을 추가해 주세요.</p>';
      return;
    }
    grid.innerHTML = items.map(r => {
      const [cat, name, price, spec1, spec2, img] = r.map(v => (v || '').trim());
      const imgHtml = img
        ? `<img src="${img}" alt="${name}" style="width:100%; height:100%; object-fit:cover;">`
        : '제품 사진 준비중';
      return `
        <div class="card" data-cat="${cat}">
          <div class="card-img">${imgHtml}</div>
          <div class="card-body">
            <span class="card-tag">${cat || '상품'}</span>
            <h3>${name}</h3>
            ${spec1 ? `<div class="spec">${spec1}</div>` : ''}
            ${spec2 ? `<div class="spec">${spec2}</div>` : ''}
            <div class="price">${price || '가격 문의'}</div>
            <a href="index.html#contact" class="buy">문의하기</a>
          </div>
        </div>`;
    }).join('');
    attachFilters();
  }

  function attachFilters(){
    const buttons = document.querySelectorAll('.filter-tabs button');
    const cards = document.querySelectorAll('#productGrid .card');
    buttons.forEach(btn => {
      btn.onclick = () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        cards.forEach(c => {
          c.style.display = (f === 'all' || c.dataset.cat === f) ? '' : 'none';
        });
        document.querySelector('.scroll-area').scrollTop = 0;
      };
    });
  }

  if (SHEET_CSV_URL && !SHEET_CSV_URL.includes('여기에')){
    fetch(SHEET_CSV_URL)
      .then(res => res.text())
      .then(text => renderProducts(parseCSV(text)))
      .catch(() => {
        document.getElementById('productGrid').innerHTML =
          '<p style="color:var(--text-dim); grid-column:1/-1;">상품 목록을 불러오지 못했습니다. 구글시트 링크를 확인해 주세요.</p>';
      });
  } else {
    document.getElementById('productGrid').innerHTML =
      '<p style="color:var(--text-dim); grid-column:1/-1;">구글시트 연결이 아직 설정되지 않았습니다.</p>';
  }
</script>

</body>
</html>
